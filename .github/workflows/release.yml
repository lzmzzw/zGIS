name: 发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      build-installer: false
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            assets: windows
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            assets: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖与核对发布版本
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-version.mjs "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tagCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG"
          $headCommit = git rev-parse HEAD
          if (-not $tagCommit -or $tagCommit -ne $headCommit) { throw '发布标签与构建提交不一致。' }
      - name: 核对 macOS ARM64 runner
        if: matrix.assets == 'macos'
        run: test "$(uname -m)" = arm64
      - name: 构建平台安装包
        uses: tauri-apps/tauri-action@v1
        with:
          # 不传 releaseId/tagName；平台任务没有发布权限，只构建产物。
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: 核验 macOS 应用架构与签名
        if: matrix.assets == 'macos'
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/zGIS.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app"
      - name: 核验 macOS 应用架构与签名
        if: matrix.assets == 'macos'
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/zGIS.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app"
      - name: 整理平台产物
        run: node scripts/release-assets.mjs ${{ matrix.assets }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  release:
    # matrix 的两个平台和所有检查均成功后，才创建/更新并公开 Release。
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: 再核对版本与标签提交
        id: version
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: 校验平台产物并生成统一 SHA256SUMS
        run: node scripts/release-assets.mjs checksums
      - name: 防止覆盖已发布版本并准备草稿
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const notes = fs.readFileSync(`docs/releases/${tag.slice(1)}.md`, 'utf8');
            const body = `${notes.trim()}\n\nWindows x64 NSIS 安装包及 macOS ARM64 DMG/app 压缩包，校验文件见 SHA256SUMS.txt。macOS 产物暂未使用 Developer ID 签名和 Apple 公证。`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) throw new Error('该版本已发布，请使用新的版本标签。');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const fields = { owner, repo, name: `zGIS ${tag}`, body, draft: true, prerelease: ${{ steps.version.outputs.prerelease == 'true' }} };
            if (release) {
              release = (await github.rest.repos.updateRelease({ ...fields, release_id: release.id })).data;
              // 同标签重跑草稿时移除遗留资产，避免旧产物混入本次发行。
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id });
              for (const asset of assets) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            } else {
              // 已通过标签 SHA 核对；默认分支只用于 GitHub API 权限兼容，不创建标签。
              release = (await github.rest.repos.createRelease({ ...fields, tag_name: tag, target_commitish: context.payload.repository.default_branch })).data;
            }
            core.setOutput('release-id', release.id);
      - name: 上传全部产物与校验文件
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
      - name: 完成发布
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ steps.draft.outputs.release-id }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            if (assets.length !== 4 || assets.some(asset => asset.size === 0) || !assets.some(asset => asset.name === 'SHA256SUMS.txt')) {
              throw new Error('Release 资产未完整上传，保持草稿。');
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
