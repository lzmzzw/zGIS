name: 检查与构建

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      build-installer:
        type: boolean
        default: true
    outputs:
      commit:
        description: 已通过检查的源码提交
        value: ${{ jobs.check.outputs.commit }}

permissions:
  contents: read

jobs:
  check-web:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/spatial-core
      - name: 安装依赖与 WASM 工具
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/install-wasm-bindgen.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Web 静态资源
        run: pnpm build:web
      - name: 共享空间核心测试与静态检查
        shell: pwsh
        run: |
          . scripts/msvc-environment.ps1
          cargo test --manifest-path crates/spatial-core/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path crates/spatial-core/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm analysis:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 浏览器验证静态资源
        run: |
          pnpm exec playwright install msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 整理 Web 资源包
        run: node scripts/release-assets.mjs web
      - uses: actions/upload-artifact@v6
        with:
          name: zGIS-web
          path: release-assets/*_web.zip
          if-no-files-found: error
          retention-days: 14
      - name: 保存 Web 回归失败现场
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/web-0.4.0/playwright/
          if-no-files-found: ignore
          retention-days: 14
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 核对版本与标签
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-version.mjs "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: 检查类型与未使用代码
        run: pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters
      - name: 前端测试
        run: pnpm test
      - name: Rust 测试
        shell: pwsh
        run: |
          . scripts/msvc-environment.ps1
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust 静态检查
        shell: pwsh
        run: |
          . scripts/msvc-environment.ps1
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建前端
        run: pnpm build
      - name: 页面回归
        shell: pwsh
        run: |
          pnpm exec playwright install msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 前一步已构建 dist；预览生产产物，避免开发模式的模块转换和 Worker 冷启动影响回归。
          $vite = Start-Process -FilePath node -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '1421', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput 'vite-ci.log' -RedirectStandardError 'vite-ci-error.log'
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try { $null = Invoke-WebRequest 'http://127.0.0.1:1421'; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite 测试服务未启动。' }
            pnpm exec playwright test --workers=2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $vite.Id -ErrorAction SilentlyContinue }
      - name: 保存页面回归失败现场
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/
            vite-ci.log
            vite-ci-error.log
          if-no-files-found: ignore
          retention-days: 14
      - name: 构建 Windows x64 安装包
        if: inputs.build-installer || inputs.tag == ''
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: 保存构建产物
        if: inputs.build-installer || inputs.tag == ''
        uses: actions/upload-artifact@v6
        with:
          name: zGIS-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
  check-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 核对 ARM64 runner 与版本
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
          node scripts/check-version.mjs "$RELEASE_TAG"
      - name: 检查类型与未使用代码
        run: pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters
      - name: 前端测试
        run: pnpm test
      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --lib --locked
      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --lib --locked -- -D warnings
      - name: 构建前端
        run: pnpm build
      - name: 构建 macOS ARM64 应用与磁盘镜像
        if: inputs.build-installer || inputs.tag == ''
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: 核验 macOS 应用架构与签名
        if: inputs.build-installer || inputs.tag == ''
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/zGIS.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app"
      - name: 整理 macOS 产物
        if: inputs.build-installer || inputs.tag == ''
        run: node scripts/release-assets.mjs macos
      - name: 保存构建产物
        if: inputs.build-installer || inputs.tag == ''
        uses: actions/upload-artifact@v6
        with:
          name: zGIS-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
