[package]
name = "zgis"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/lzmzzw/zGIS"

[lib]
name = "zgis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rfd = "0.15"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
native-tls = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
semver = "=1.0.28"
base64 = "=0.23.1"
postgres-native-tls = "0.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
shapefile = { version = "0.7", features = ["geo-types"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
geo = "0.32"
i_float = "=1.15.0"
geojson = { version = "0.24", features = ["geo-types"] }
wkt = "0.14"
csv = "1"
dbase = { version = "0.6", features = ["encoding_rs"] }
axum = "0.8"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
